[package]
name = "hybrid_ttt_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "High-performance Rust sandbox verifier and parallel Git history extractor for Hybrid-TTT-Coder"
license = "Apache-2.0"

[lib]
name = "hybrid_ttt_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
git2 = { version = "0.20.4", default-features = false, features = ["vendored-libgit2"] }
libc = "0.2.171"
pyo3 = { version = "0.24.2" }
rayon = "1.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

[dev-dependencies]
tempfile = "3.19.1"

[features]
default = []
# Enabled exclusively by Maturin when compiling the Python extension shared library.
# Kept off by default so `cargo test` links cleanly against libpython.
extension-module = ["pyo3/extension-module"]

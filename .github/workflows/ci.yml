name: Hybrid-TTT-Coder CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  rust-lint-and-test:
    name: Rust Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11 for PyO3 libpython linkage
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.toml', 'rust_core/Cargo.toml', 'rust_core/src/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Rust formatting
        run: cargo fmt

      - name: Run Clippy with zero warnings tolerance
        run: |
          export PYO3_PYTHON="$(which python3)"
          cargo clippy --all-targets -- -D warnings

      - name: Run Rust unit tests (sandbox timeout, reward scoring, git diff extraction)
        run: |
          export PYO3_PYTHON="$(which python3)"
          PYTHON_LIBDIR="$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          export LD_LIBRARY_PATH="${PYTHON_LIBDIR}:${LD_LIBRARY_PATH:-}"
          cargo test --all-targets -- --nocapture

  build-and-python-lint:
    name: Build PyO3 Extension & Python Static Analysis
    runs-on: ubuntu-latest
    needs: [rust-lint-and-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-maturin-${{ hashFiles('Cargo.toml', 'rust_core/Cargo.toml', 'rust_core/src/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-maturin-

      - name: Install CPU PyTorch and dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3.0"
          pip install "maturin>=1.8,<2.0" "ruff>=0.9.0" "mypy>=1.14.0" "pytest>=8.3.0"

      - name: Compile hybrid_ttt_native extension with Maturin (release)
        run: maturin develop --release

      - name: Build distributable release wheel for downstream CI jobs
        run: maturin build --release --out dist

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

      - name: Run Mypy strict type checking (including Rust .pyi stub)
        run: mypy model runtime train eval tests typings

      - name: Upload compiled wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-ttt-coder-wheel
          path: dist/*.whl
          retention-days: 1

  unit-tests:
    name: Python Unit Tests & Coverage Gate (>=80%)
    runs-on: ubuntu-latest
    needs: [build-and-python-lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Download prebuilt wheel
        uses: actions/download-artifact@v4
        with:
          name: hybrid-ttt-coder-wheel
          path: dist

      - name: Install CPU PyTorch, prebuilt native extension, and pytest-cov
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3.0"
          pip install "pytest>=8.3.0" "pytest-cov>=6.0.0"
          pip install --no-deps --force-reinstall dist/*.whl

      - name: Run pytest suite with 80% minimum coverage gate
        run: |
          pytest \
            --cov=model \
            --cov=runtime \
            --cov=train \
            --cov=eval \
            --cov-report=term-missing \
            --cov-fail-under=80

  model-sanity-and-eval:
    name: Tiny-Test Sanity, Benchmark & Artifact Report
    runs-on: ubuntu-latest
    needs: [build-and-python-lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Download prebuilt wheel
        uses: actions/download-artifact@v4
        with:
          name: hybrid-ttt-coder-wheel
          path: dist

      - name: Install CPU PyTorch and prebuilt native extension
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3.0"
          pip install --no-deps --force-reinstall dist/*.whl

      - name: Run quantitative evaluation benchmark with strict CI thresholds
        run: |
          python -m eval.benchmark \
            --preset tiny \
            --output eval_report.json \
            --markdown-out eval_summary.md \
            --strict-ci

      - name: Publish Markdown benchmark summary to GitHub Step Summary
        if: always()
        run: |
          if [ -f eval_summary.md ]; then
            cat eval_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload eval_report.json artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_report.json
          retention-days: 14
